version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: salon_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-salon}
      MYSQL_USER: ${DB_USER:-salon}
      MYSQL_PASSWORD: ${DB_PASSWORD:-salonpass}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: salon_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-salon}
      DB_PASSWORD: ${DB_PASSWORD:-salonpass}
      DB_NAME: ${DB_NAME:-salon}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./public/uploads:/app/public/uploads

volumes:
  db_data:
    driver: local